<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshade — a stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { width: 1280px; max-width: 100vw; }
  canvas { display: block; width: 100%; height: auto; background: #0b1020; cursor: pointer; }
  p { color: #5c6b8c; font: 13px Georgia, serif; text-align: center; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <p>Nightshade — WASD / arrows to move · Shift to sneak · Space to dash · P to pause · M to mute</p>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
